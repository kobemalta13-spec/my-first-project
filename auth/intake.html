<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us- Intake Form</title>
    <style>

        body{
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;

        }

        header{
            background-color: #3b82f6;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align:center;
            margin-top: 20px;
     }

        label {
            display:block;
            margin-top: 15px;
            font-weight: bold;

        }
       
        input {
            width: 97%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #8ac221;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 10px rgba(0, 0, 0, 0.25);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background-color: #e5e7eb;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    
    <header>
        <h1>Contact Us</h1>
    </header>

    <main>
        <h2>Intake Form</h2>
        <form action="submit_form.php" method="POST">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" placeholder="John" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" placeholder="Doe" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="New York" required>
            
            <label for="state">State:</label>
            <input type="text" id="state" name="state" placeholder="NY" maxlength="2" required>
            
            <button type="submit">Submit</button>
        </form>

        <a class="back-link" href="../index.html">&larr; Back to Home</a>
    </main>
     

    <footer>
      <p>  &copy; 2026 VetBoss. All rights reserved.</p>
    </footer>
</body>
</html>
